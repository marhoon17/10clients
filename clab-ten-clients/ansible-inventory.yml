all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    bridge:
      hosts:
        clab-ten-clients-br-clab:
          ansible_host: 
    linux:
      hosts:
        clab-ten-clients-client1:
          ansible_host: 172.20.20.17
        clab-ten-clients-client10:
          ansible_host: 172.20.20.12
        clab-ten-clients-client2:
          ansible_host: 172.20.20.18
        clab-ten-clients-client3:
          ansible_host: 172.20.20.13
        clab-ten-clients-client4:
          ansible_host: 172.20.20.14
        clab-ten-clients-client5:
          ansible_host: 172.20.20.19
        clab-ten-clients-client6:
          ansible_host: 172.20.20.20
        clab-ten-clients-client7:
          ansible_host: 172.20.20.15
        clab-ten-clients-client8:
          ansible_host: 172.20.20.16
        clab-ten-clients-client9:
          ansible_host: 172.20.20.21
